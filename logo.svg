<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2520"/>
      <stop offset="100%" stop-color="#124637"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2c3"/>
      <stop offset="100%" stop-color="#00a884"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon Container (80x80 at x=10, y=10) -->
  <g transform="translate(10, 10)">
    <!-- Outer Network Ring -->
    <circle cx="40" cy="40" r="38" fill="url(#bgGrad)" stroke="#1d5c49" stroke-width="2"/>
    <circle cx="40" cy="40" r="34" fill="none" stroke="#00f2c3" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    
    <!-- Community Network Nodes -->
    <circle cx="14" cy="26" r="3" fill="#00f2c3" opacity="0.8"/>
    <circle cx="66" cy="26" r="3" fill="#00f2c3" opacity="0.8"/>
    <circle cx="20" cy="62" r="3" fill="#38ef7d" opacity="0.8"/>
    <circle cx="60" cy="62" r="3" fill="#38ef7d" opacity="0.8"/>
    <path d="M14 26 L40 40 L66 26 M20 62 L40 40 L60 62" stroke="#00f2c3" stroke-width="0.8" opacity="0.4"/>

    <!-- Urban Skyline Silhouette inside -->
    <path d="M22 56 L22 42 L28 42 L28 56 Z" fill="#1b5141" opacity="0.9"/>
    <path d="M28 56 L28 36 L36 36 L36 56 Z" fill="#246a56" opacity="0.9"/>
    <path d="M44 56 L44 34 L52 34 L52 56 Z" fill="#246a56" opacity="0.9"/>
    <path d="M52 56 L52 44 L58 44 L58 56 Z" fill="#1b5141" opacity="0.9"/>

    <!-- Civic Location Pin -->
    <path d="M40 18 C31.7 18 25 24.7 25 33 C25 43.5 40 58 40 58 C40 58 55 43.5 55 33 C55 24.7 48.3 18 40 18 Z" 
          fill="url(#tealGrad)" filter="url(#glow)"/>
    <circle cx="40" cy="32" r="7.5" fill="#0a2520"/>

    <!-- Resolution Checkmark / Pulse inside pin -->
    <path d="M36 32 L39 35 L45 28" fill="none" stroke="#00f2c3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography / Wordmark -->
  <g transform="translate(105, 26)">
    <!-- Main Title -->
    <text x="0" y="28" font-family="'Manrope', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="-0.5">
      Smart Civic <tspan fill="#00f2c3">Connect</tspan>
    </text>
    
    <!-- Tagline -->
    <text x="1" y="49" font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="9.5" fill="#93aba2" letter-spacing="1.8">
      ONE CITY. EVERY VOICE. SMARTER SOLUTIONS.
    </text>

    <!-- UN SDG 11 Badge -->
    <g transform="translate(268, 8)">
      <rect x="0" y="0" width="76" height="18" rx="4" fill="#10362c" stroke="#1d5c49" stroke-width="1"/>
      <circle cx="9" cy="9" r="4.5" fill="#f89d2a"/>
      <text x="19" y="12.5" font-family="'DM Sans', sans-serif" font-weight="700" font-size="7.5" fill="#e0eee7" letter-spacing="0.5">SDG 11 CITIES</text>
    </g>
  </g>
</svg>
